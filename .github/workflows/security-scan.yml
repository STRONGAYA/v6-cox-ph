name: Weekly Security Scan

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-scan:
    name: pip-audit on the lock file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit the locked runtime dependencies
        run: |
          # Suppressions live in .pip-audit-ignore with a justification and
          # an expiry date per entry; see that file's header.
          IGNORES=$(grep -E '^\-\-ignore-vuln' .pip-audit-ignore | tr '\n' ' ')
          pip-audit -r requirements-lock.txt --strict $IGNORES

  bandit:
    name: Bandit on the source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit (medium and up)
        run: |
          bandit -r v6-cox-ph/ -ll

  trivy:
    name: Trivy on the released image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code (full history, to find the latest tag)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine the latest released image
        id: image
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No released tag found; nothing to scan." 
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Deterministic rule (same as release.yaml): the branch whose tip is
          # the tagged commit; fail when none or several match.
          TIP=$(git rev-parse "${TAG}^{commit}")
          BRANCHES=$(git for-each-ref refs/remotes/origin \
            --format='%(refname:lstrip=3) %(objectname)' \
            | awk -v tip="$TIP" '$2 == tip { print $1 }' \
            | grep -v '^HEAD$')
          COUNT=$(printf '%s\n' "$BRANCHES" | grep -c . || true)
          if [ "$COUNT" -eq 0 ] || [ "$COUNT" -gt 1 ]; then
            echo "::error::Could not determine the branch of tag ${TAG} (found: ${BRANCHES:-none})."
            exit 1
          fi
          REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          BRANCH_NAME=$(echo "$BRANCHES" | sed 's/\//-/g')
          echo "image=${REPO_LOWER}-${BRANCH_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        if: steps.image.outputs.skip != 'true'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the released image
        if: steps.image.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-reference: ghcr.io/${{ steps.image.outputs.image }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  report:
    name: Open an issue on failure
    needs: [lock-scan, bandit, trivy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or comment on the security-scan issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BODY="The weekly security scan failed for run ${{ github.run_id }}.
          See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Policy: triage within one working week. Failures on HIGH/CRITICAL with
          a fix available require a lock/digest bump, rebuild, tests and a patch
          tag; the CVE goes into the CHANGELOG. Suppressions must be committed
          with a justification and an expiry date."
          ISSUE=$(gh issue list --label security-scan --state open --json number --jq '.[0].number')
          if [ -z "$ISSUE" ]; then
            gh issue create --title "Weekly security scan failed" --body "$BODY" --label security-scan
          else
            gh issue comment "$ISSUE" --body "$BODY"
          fi
