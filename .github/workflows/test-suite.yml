name: Test Suite

on:
  push:
    branches: [main, phase1-algorithm-improvements, phase2-strong-aya]
  pull_request:
    branches: [main, phase1-algorithm-improvements, phase2-strong-aya]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10" ]
        vantage6-version: [ "4.14", "4.15" ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vantage6==${{ matrix.vantage6-version }}
          pip install -e .[dev]

      - name: Run tests
        run: |
          pytest

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[lint]

      - name: Run Black code formatter check
        run: |
          black --fast --check --diff --target-version py310 v6-cox-ph/ tests/

      - name: Run Flake8 linter
        run: |
          flake8 v6-cox-ph/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run MyPy type checker
        run: |
          find v6-cox-ph/ -name "*.py" ! -name "__init__.py" -exec mypy {} --ignore-missing-imports --follow-imports=silent \;

  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install security scanning dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security linter
        run: |
          bandit -r v6-cox-ph/ -f json -o bandit-report.json || true

      - name: Check dependencies for known vulnerabilities
        run: |
          safety check --json --output safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
