[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "v6-cox-ph"
version = "1.0.0"
description = "Federated Cox Proportional Hazards algorithm for STRONG AYA"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "STRONGAYA Consortium", email = "strongaya@maastrichtuniversity.nl" }
]
maintainers = [
    { name = "STRONGAYA Consortium", email = "strongaya@maastrichtuniversity.nl" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "vantage6-algorithm-tools==4.15",
    "pandas>=2.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "vantage6-strongaya-general @ git+https://github.com/STRONGAYA/v6-tools-general.git@v1.0.4",
    "vantage6-strongaya-rdf @ git+https://github.com/STRONGAYA/v6-tools-rdf.git@v1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "docker>=6.0.0",
    "numpy>=2.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
test-ci = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "docker>=6.0.0",
    "numpy>=2.0.0",
]
lint = [
    "flake8",
    "black",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/STRONGAYA/v6-cox-ph"
Bugtracker = "https://github.com/STRONGAYA/v6-cox-ph/issues"

[tool.setuptools]
package-dir = {v6_cox_ph = "v6-cox-ph"}
packages = ["v6_cox_ph"]

[tool.setuptools.package-data]
v6_cox_ph = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "unit: Unit tests for algorithm functions",
    "integration: Integration tests with Vantage6",
    "slow: Tests that take a long time to run",
    "vantage6: Tests that require Vantage6 infrastructure",
    "docker: Tests that require Docker",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
